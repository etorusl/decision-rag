[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "decision-rag"
version = "0.1.0"
description = "Reproducible hierarchical retrieval with non-generative decision models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "httpx>=0.27,<1", "tqdm>=4.67,<5"]

[project.optional-dependencies]
inference = ["transformers==4.57.1", "huggingface-hub>=0.34,<1"]
vllm = ["vllm==0.11.2", "transformers==4.57.1"]
local = ["torch>=2.7,<2.8", "transformers==4.57.1", "accelerate>=1.4,<2", "safetensors>=0.5", "sentence-transformers>=3.4,<6", "scikit-learn>=1.5,<2", "peft>=0.15,<1"]
data = ["datasets>=3.3,<5", "beautifulsoup4>=4.12,<5"]
gpu-clustering = ["cuml-cu12==26.10.0; sys_platform == 'linux'"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
decision-rag = "decision_rag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/decision_rag"]
